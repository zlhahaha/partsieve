name: CI

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Windows Native CLI and SDK regression
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit toolchain
        shell: pwsh
        env:
          MOONBIT_INSTALL_VERSION: '0.10.14+7d59c7ec9'
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest https://cli.moonbitlang.com/install/powershell.ps1 -OutFile "$env:RUNNER_TEMP\install-moonbit.ps1"
          & "$env:RUNNER_TEMP\install-moonbit.ps1"
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check and build with MSVC
        shell: pwsh
        run: |
          $taskVswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $taskVs = & $taskVswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $taskVs) { throw 'MSVC installation missing' }
          $taskDev = Join-Path $taskVs 'Common7\Tools\VsDevCmd.bat'
          $taskEnv = & cmd.exe /c "call `"$taskDev`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment failed' }
          foreach ($taskLine in $taskEnv) {
            if ($taskLine -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $taskPathLine = $taskEnv | Where-Object { $_ -match '^Path=' } | Select-Object -First 1
          if (-not $taskPathLine) { throw 'MSVC PATH missing' }
          $env:PATH = $taskPathLine.Substring(5)
          Get-Command cl.exe
          .\tools\check.ps1
      - name: Keep actual regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-regression
          path: |
            tests/generated/business-v3/*.receipt.json
            tests/generated/business-v3/report-1900.xlsx
            tests/generated/business-v3/report-1904.xlsx
            tests/generated/business-v3/report-inline.xlsx
            tests/generated/business-v3/document-layout.docx
            tests/generated/business-v3/document-template.docx
            tests/generated/resources-v6.json
            tests/generated/next-v6/word-links.*
            tests/generated/next-v6/sheet-links.*
            tests/generated/next-v6/word-ole-png.*
            tests/generated/next-v6/word-ole-emf.*
            tests/generated/next-v6/word-ole-clean.*
            tests/generated/next-v6/word-ole-only.*
            docs/evidence/verified.xlsx
            docs/evidence/verified.receipt.json
            docs/evidence/word-verified.docx
            docs/evidence/word-verified.receipt.json

  linux-native:
    name: Linux Native CLI and SDK regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit toolchain
        env:
          MOONBIT_INSTALL_VERSION: '0.10.14+7d59c7ec9'
        run: |
          curl --fail --silent --show-error https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
          bash "$RUNNER_TEMP/install-moonbit.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check dependency hashes and run native regression
        shell: pwsh
        run: ./tools/check.ps1

  independent:
    name: Independent ZIP and Open XML SDK
    runs-on: ubuntu-24.04
    needs: [native, linux-native]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Retrieve output bytes generated by the Native SDK job
        uses: actions/download-artifact@v4
        with:
          name: native-regression
          path: .
      - name: Check pinned fixture provenance
        shell: pwsh
        run: ./tools/check-fixtures.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Install independent schema validator
        run: python -m pip install jsonschema==4.23.0
      - name: Independently validate the published example pair
        run: |
          python tests/independent_zip.py tests/fixtures/upstream/macro01.xlsm docs/evidence/verified.xlsx > independent-zip-ci.json
          dotnet restore tests/OpenXmlValidation
          dotnet run --no-restore --project tests/OpenXmlValidation -- tests/fixtures/upstream/macro01.xlsm docs/evidence/verified.xlsx tests/fixtures/upstream/simple01.xlsx > openxml-ci.json
          python tests/independent_word.py tests/fixtures/poi/SimpleMacro.docm docs/evidence/word-verified.docx > word-independent-zip-ci.json
          dotnet run --no-restore --project tests/OpenXmlValidation -- tests/fixtures/poi/SimpleMacro.docm docs/evidence/word-verified.docx > word-openxml-ci.json
          python tests/independent_business.py --next tests/generated/next-v6 > business-independent-ci.json
          dotnet run --no-restore --project tests/OpenXmlValidation -- tests/fixtures/business/report-1900.xlsm tests/fixtures/business/report-1904.xlsm tests/fixtures/business/report-inline.xlsm tests/fixtures/business/document-layout.docm tests/fixtures/business/document-template.docm tests/generated/business-v3/report-1900.xlsx tests/generated/business-v3/report-1904.xlsx tests/generated/business-v3/report-inline.xlsx tests/generated/business-v3/document-layout.docx tests/generated/business-v3/document-template.docx > business-openxml-ci.json
      - name: Validate the link and OLE input/output corpus independently
        run: |
          dotnet run --no-restore --project tests/OpenXmlValidation -- tests/generated/next-v6/word-links.input.docm tests/generated/next-v6/word-links.docx tests/generated/next-v6/sheet-links.input.xlsm tests/generated/next-v6/sheet-links.xlsx tests/generated/next-v6/word-ole-png.input.docm tests/generated/next-v6/word-ole-png.docx tests/generated/next-v6/word-ole-emf.input.docm tests/generated/next-v6/word-ole-emf.docx tests/generated/next-v6/word-ole-clean.input.docx tests/generated/next-v6/word-ole-clean.docx tests/generated/next-v6/word-ole-only.input.docm tests/generated/next-v6/word-ole-only.docx > next-openxml-ci.json
      - name: Keep independent validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: independent-validation
          path: |
            independent-zip-ci.json
            openxml-ci.json
            word-independent-zip-ci.json
            word-openxml-ci.json
            business-independent-ci.json
            business-openxml-ci.json
            next-openxml-ci.json
